name: Build WiFi KO Only
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libelf-dev libssl-dev build-essential
      - name: Get Kernel Source
        run: |
          git clone --depth=1 https://github.com/szymonqzx/apex.git -b zepharo kernel
          cd kernel
          # Enable only needed drivers
          echo "CONFIG_MT7601U=m" >> arch/arm64/configs/tapas_defconfig
          echo "CONFIG_RT2X00=m" >> arch/arm64/configs/tapas_defconfig
          echo "CONFIG_RT2X00_LIB=m" >> arch/arm64/configs/tapas_defconfig
          echo "CONFIG_RT2800USB=m" >> arch/arm64/configs/tapas_defconfig
          echo "CONFIG_RT2X00_LIB_USB=m" >> arch/arm64/configs/tapas_defconfig
      - name: Build Modules Only
        run: |
          cd kernel
          make O=out tapas_defconfig
          make O=out -j2 modules -k
          find out -name "mt7601u.ko" -o -name "rt2800usb.ko" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: tapas-wifi-drivers
          path: kernel/out/**/*.ko
